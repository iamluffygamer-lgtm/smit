<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON SURGE: OVERDRIVE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap');

        :root {
            --neon-blue: #00f3ff;
            --neon-red: #ff0055;
            --neon-gold: #ffcc00;
            --bg-color: #08080a;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Rajdhani', sans-serif;
            user-select: none;
            touch-action: none;
            cursor: none;
            /* Custom cursor drawn in canvas */
        }

        /* UI Overlay */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        /* HUD */
        #hud {
            position: absolute;
            top: 20px;
            width: 90%;
            display: flex;
            justify-content: space-between;
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            opacity: 0;
            /* Hidden until start */
            transition: opacity 0.5s;
        }

        .hud-item span {
            color: var(--neon-blue);
        }

        /* Dash Bar */
        #dash-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 6px;
            background: #333;
            border-radius: 3px;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.5s;
        }

        #dash-fill {
            width: 100%;
            height: 100%;
            background: var(--neon-blue);
            box-shadow: 0 0 10px var(--neon-blue);
            transform-origin: left;
        }

        /* Menus */
        .menu-screen {
            pointer-events: auto;
            text-align: center;
            background: rgba(8, 8, 10, 0.85);
            backdrop-filter: blur(5px);
            padding: 40px;
            border: 1px solid #333;
            border-radius: 0px;
            box-shadow: 0 0 50px rgba(0, 243, 255, 0.1);
            transform: skew(-2deg);
        }

        h1 {
            font-size: 4rem;
            margin: 0;
            line-height: 0.9;
            color: #fff;
            text-transform: uppercase;
            text-shadow: 4px 4px 0px var(--neon-red);
        }

        h1 span {
            color: var(--neon-blue);
        }

        button {
            margin-top: 30px;
            padding: 15px 50px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 1.5rem;
            text-transform: uppercase;
            color: var(--bg-color);
            background: var(--neon-blue);
            border: none;
            cursor: pointer;
            clip-path: polygon(10% 0, 100% 0, 100% 80%, 90% 100%, 0 100%, 0 20%);
            transition: 0.2s;
        }

        button:hover {
            transform: scale(1.05) translateY(-2px);
            background: #fff;
            box-shadow: 0 0 30px var(--neon-blue);
        }

        .hidden {
            display: none !important;
        }

        /* Glitch Animation for Title */
        .glitch {
            animation: glitch 3s infinite;
        }

        @keyframes glitch {
            0% {
                text-shadow: 4px 4px 0 var(--neon-red);
            }

            98% {
                text-shadow: 4px 4px 0 var(--neon-red);
            }

            99% {
                text-shadow: -4px -4px 0 var(--neon-blue);
                transform: translate(-2px, 2px);
            }

            100% {
                text-shadow: 4px 4px 0 var(--neon-red);
                transform: translate(0, 0);
            }
        }
    </style>
</head>

<body>

    <div id="ui-layer">
        <div id="hud">
            <div class="hud-item">TIME: <span id="time-display">0.0</span></div>
            <div class="hud-item" style="color: var(--neon-gold)">COMBO: x<span id="combo-display" style="color: #fff">0</span></div>
            <div class="hud-item">BEST: <span id="best-display">0.0</span></div>
        </div>

        <div id="start-screen" class="menu-screen">
            <h1 class="glitch">NEON<br><span>SURGE</span></h1>
            <p style="color:#aaa; letter-spacing: 2px; margin-top: 10px;">MOVE TO SURVIVE // CLICK TO DASH</p>
            <button id="btn-start">INITIATE</button>
        </div>

        <div id="game-over-screen" class="menu-screen hidden">
            <h1 style="font-size: 3rem; color: var(--neon-red); text-shadow: none;">CRITICAL<br>FAILURE</h1>
            <p style="color: #fff; font-size: 1.5rem; margin: 20px 0;">SURVIVAL TIME: <span id="final-time"
                    style="color: var(--neon-blue)">0.0s</span></p>
            <button id="btn-restart">RETRY</button>
        </div>

        <div id="dash-container">
            <div id="dash-fill"></div>
        </div>
    </div>

    <canvas id="game-canvas"></canvas>

    <script>
        /** * AUDIO SYSTEM (Web Audio API)
         * Generates sounds on the fly (no assets needed)
         */
        const AudioSys = {
            ctx: null,
            init: function () {
                window.AudioContext = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioContext();
            },
            playTone: function (freq, type, duration, vol = 0.1) {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                // Pitch drop effect
                osc.frequency.exponentialRampToValueAtTime(freq * 0.5, this.ctx.currentTime + duration);

                gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            },
            playExplosion: function () {
                this.playTone(150, 'sawtooth', 0.3, 0.2);
                this.playTone(100, 'square', 0.4, 0.2);
            },
            playCollect: function () {
                this.playTone(800, 'sine', 0.1, 0.1);
                this.playTone(1200, 'sine', 0.1, 0.05); // High ping
            },
            playShoot: function () {
                this.playTone(600, 'square', 0.1, 0.05);
            },
            playSurge: function () {
                this.playTone(100, 'sawtooth', 1.0, 0.3);
                this.playTone(200, 'square', 1.0, 0.2);
            },
            playDash: function () {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(200, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(600, this.ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.2);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.2);
            }
        };

        /**
         * GAME ENGINE
         */
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const hud = document.getElementById('hud');
        const dashBar = document.getElementById('dash-container');
        const dashFill = document.getElementById('dash-fill');
        const timeDisplay = document.getElementById('time-display');
        const bestDisplay = document.getElementById('best-display');
        const finalTimeDisplay = document.getElementById('final-time');

        let width, height;
        let animationId;
        let lastTime = 0;
        let time = 0;
        let score = 0;
        let highScore = parseFloat(localStorage.getItem('neonSurgeBest')) || 0.0;
        bestDisplay.innerText = highScore.toFixed(1);

        // State
        let gameState = 'MENU'; // MENU, PLAYING, GAMEOVER
        let mouse = { x: 0, y: 0 };
        let shake = 0;
        let chromatic = 0; // Glitch intensity
        let combo = 0;
        let comboTimer = 0;
        let floatingTexts = [];
        let projectiles = [];
        let isSurge = false;
        let surgeTimer = 0;
        let nextSurgeAt = 30;

        // Entities
        const player = {
            x: 0, y: 0,
            vx: 0, vy: 0,
            radius: 8,
            trail: [],
            dashCooldown: 0,
            isDashing: false,
            dashDuration: 0,
            color: '#00f3ff'
        };

        let enemies = [];
        let particles = [];
        let powerups = [];
        let gridOffset = { x: 0, y: 0 };

        // Resize
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Input
        window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
        window.addEventListener('touchmove', e => {
            e.preventDefault();
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
        }, { passive: false });

        const triggerDash = () => {
            if (gameState !== 'PLAYING') return;
            if (player.dashCooldown <= 0) {
                player.isDashing = true;
                player.dashDuration = 15; // frames
                player.dashCooldown = 100; // frames
                AudioSys.playDash();

                // Dash towards mouse momentum
                let angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
                player.vx = Math.cos(angle) * 20;
                player.vy = Math.sin(angle) * 20;

                shake = 10;
                chromatic = 10;
            }
        };

        window.addEventListener('mousedown', triggerDash);
        window.addEventListener('keydown', e => { if (e.code === 'Space') triggerDash(); });

        // Utils
        const dist = (x1, y1, x2, y2) => Math.hypot(x1 - x2, y1 - y2);
        const rand = (min, max) => Math.random() * (max - min) + min;

        // Game Loop
        function startGame() {
            AudioSys.init(); // Initialize audio context on user interaction
            gameState = 'PLAYING';

            // Reset Variables
            player.x = width / 2; player.y = height / 2;
            player.vx = 0; player.vy = 0;
            player.trail = [];
            player.dashCooldown = 0;
            enemies = [];
            particles = [];
            powerups = [];
            score = 0;
            combo = 0;
            comboTimer = 0;
            floatingTexts = [];
            projectiles = [];
            isSurge = false;
            surgeTimer = 0;
            nextSurgeAt = 30;
            document.getElementById('combo-display').innerText = '0';
            lastTime = Date.now();

            // UI Updates
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            hud.style.opacity = 1;
            dashBar.style.opacity = 1;
            document.body.style.cursor = 'none';

            animate();
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            document.body.style.cursor = 'default';
            AudioSys.playExplosion();

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('neonSurgeBest', highScore);
                bestDisplay.innerText = highScore.toFixed(1);
            }

            hud.style.opacity = 0;
            dashBar.style.opacity = 0;
            finalTimeDisplay.innerText = score.toFixed(1) + 's';
            document.getElementById('game-over-screen').classList.remove('hidden');

            // Big shake
            shake = 30;
            chromatic = 20;

            // Draw one last frame with effects
            render();
        }

        function update(dt) {
            // 1. Difficulty Scaling & Surge
            let difficulty = 1 + (score / 15);
            if (score > nextSurgeAt) {
                isSurge = true;
                surgeTimer = 300; // 5 seconds
                nextSurgeAt += 30;
                AudioSys.playSurge();
                shake = 20;
            }
            if (isSurge) {
                surgeTimer--;
                difficulty *= 3;
                if (surgeTimer <= 0) isSurge = false;
            }

            // Combo Decay
            if (comboTimer > 0) {
                comboTimer--;
                if (comboTimer <= 0) combo = 0;
            }

            // 2. Player Physics
            // Smooth follow mouse
            let angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
            let speed = player.isDashing ? 0 : 0.15; // No control during dash

            // Physics friction
            player.vx += (mouse.x - player.x) * 0.01; // Acceleration
            player.vy += (mouse.y - player.y) * 0.01;
            player.vx *= 0.9; // Friction
            player.vy *= 0.9;

            // Apply velocity
            player.x += player.vx;
            player.y += player.vy;

            // Dash Logic
            if (player.isDashing) {
                player.dashDuration--;
                // Create dash particles
                particles.push({
                    x: player.x, y: player.y,
                    vx: (Math.random() - 0.5) * 2, vy: (Math.random() - 0.5) * 2,
                    life: 1.0, color: 'rgba(0, 243, 255, 0.5)', size: 4
                });
                if (player.dashDuration <= 0) {
                    player.isDashing = false;
                    // Stop abrupt movement
                    player.vx *= 0.2;
                    player.vy *= 0.2;
                }
            }
            if (player.dashCooldown > 0) player.dashCooldown--;

            // Bounds
            if (player.x < 0) player.x = 0;
            if (player.x > width) player.x = width;
            if (player.y < 0) player.y = 0;
            if (player.y > height) player.y = height;

            // Trail
            player.trail.push({ x: player.x, y: player.y });
            if (player.trail.length > 20) player.trail.shift();

            // 3. Enemies
            // Spawn rate
            if (Math.random() < 0.04 * difficulty) {
                let type = Math.random() > 0.8 ? 1 : 0; // 0 = chaser, 1 = linear
                if (Math.random() > 0.85) type = 2; // 2 = sniper
                let ex, ey;
                // Spawn edges
                if (Math.random() < 0.5) {
                    ex = Math.random() < 0.5 ? -30 : width + 30;
                    ey = Math.random() * height;
                } else {
                    ex = Math.random() * width;
                    ey = Math.random() < 0.5 ? -30 : height + 30;
                }

                enemies.push({
                    x: ex, y: ey,
                    vx: 0, vy: 0,
                    angle: 0,
                    speed: type === 2 ? rand(1, 2) + difficulty*0.5 : rand(3, 5) + difficulty,
                    type: type,
                    radius: type === 1 ? 12 : (type === 2 ? 10 : 8),
                    color: type === 1 ? '#ffcc00' : (type === 2 ? '#b500ff' : '#ff0055')
                });
            }

            enemies.forEach((e, i) => {
                if (e.type === 0) { // Chaser
                    let a = Math.atan2(player.y - e.y, player.x - e.x);
                    e.x += Math.cos(a) * e.speed;
                    e.y += Math.sin(a) * e.speed;
                } else if (e.type === 1) { // Linear (dumb but fast)
                    if (e.vx === 0) {
                        let a = Math.atan2(player.y - e.y, player.x - e.x);
                        e.vx = Math.cos(a) * (e.speed * 1.5);
                        e.vy = Math.sin(a) * (e.speed * 1.5);
                    }
                    e.x += e.vx;
                    e.y += e.vy;
                    e.angle += 0.2; // Spin effect
                } else if (e.type === 2) { // Sniper
                    let d = dist(player.x, player.y, e.x, e.y);
                    let a = Math.atan2(player.y - e.y, player.x - e.x);
                    if (d < 250) {
                        e.x -= Math.cos(a) * e.speed;
                        e.y -= Math.sin(a) * e.speed;
                    } else if (d > 350) {
                        e.x += Math.cos(a) * e.speed;
                        e.y += Math.sin(a) * e.speed;
                    } else {
                        e.angle += 0.05;
                    }
                    e.cooldown = (e.cooldown || 0) - 1;
                    if (e.cooldown <= 0) {
                        e.cooldown = 120 - Math.min(difficulty * 10, 60);
                        AudioSys.playShoot();
                        projectiles.push({
                            x: e.x, y: e.y,
                            vx: Math.cos(a) * (5 + difficulty * 0.5),
                            vy: Math.sin(a) * (5 + difficulty * 0.5),
                            radius: 4, color: '#b500ff'
                        });
                    }
                }

                // Collision
                let d = dist(player.x, player.y, e.x, e.y);
                if (d < player.radius + e.radius) {
                    if (player.isDashing) {
                        // Kill Enemy
                        enemies.splice(i, 1);
                        createExplosion(e.x, e.y, e.color);
                        combo++;
                        comboTimer = 120;
                        let pts = 1 * combo;
                        score += pts;
                        shake = 5;
                        AudioSys.playCollect(); // Reuse collect sound for kill
                        floatingTexts.push({ x: e.x, y: e.y, text: `+${pts}`, life: 1.0, color: '#ffcc00' });
                        if (combo > 1) floatingTexts.push({ x: e.x, y: e.y - 15, text: `x${combo}`, life: 1.0, color: '#fff' });
                    } else {
                        // Kill Player
                        gameOver();
                    }
                }

                // Despawn
                if (e.x < -100 || e.x > width + 100 || e.y < -100 || e.y > height + 100) {
                    enemies.splice(i, 1);
                }
            });

            // 4. Powerups (Blue Orbs)
            if (Math.random() < (isSurge ? 0.05 : 0.01)) {
                powerups.push({ x: rand(50, width - 50), y: rand(50, height - 50), r: 6 });
            }
            powerups.forEach((p, i) => {
                if (dist(player.x, player.y, p.x, p.y) < player.radius + p.r + 10) {
                    powerups.splice(i, 1);
                    player.dashCooldown = Math.max(0, player.dashCooldown - 50); // Recharge dash
                    score += 2.0; // Bonus score
                    createExplosion(p.x, p.y, '#00f3ff');
                    AudioSys.playCollect();
                }
            });

            // 5. Particles
            particles.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy;
                p.life -= 0.05;
                if (p.life <= 0) particles.splice(i, 1);
            });

            // Projectiles
            projectiles.forEach((proj, i) => {
                proj.x += proj.vx;
                proj.y += proj.vy;
                if (dist(player.x, player.y, proj.x, proj.y) < player.radius + proj.radius) {
                    if (!player.isDashing) gameOver();
                }
                if (proj.x < -50 || proj.x > width + 50 || proj.y < -50 || proj.y > height + 50) {
                    projectiles.splice(i, 1);
                }
            });

            // Floating Texts
            floatingTexts.forEach((ft, i) => {
                ft.y -= 1;
                ft.life -= 0.02;
                if (ft.life <= 0) floatingTexts.splice(i, 1);
            });

            // Update UI
            let now = Date.now();
            if (gameState === 'PLAYING') score += (now - lastTime) / 1000;
            lastTime = now;

            timeDisplay.innerText = score.toFixed(1);
            document.getElementById('combo-display').innerText = combo;

            // Dash Bar UI
            let dashPct = 1 - (player.dashCooldown / 100);
            if (dashPct > 1) dashPct = 1;
            if (dashPct < 0) dashPct = 0;
            dashFill.style.transform = `scaleX(${dashPct})`;
            dashFill.style.backgroundColor = dashPct >= 1 ? '#00f3ff' : '#555';

            // Screen Shake Decay
            if (shake > 0) shake *= 0.9;
            if (shake < 0.5) shake = 0;
            if (chromatic > 0) chromatic *= 0.9;
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 10; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 1.0,
                    color: color,
                    size: rand(2, 5)
                });
            }
        }

        function render() {
            // Clear
            ctx.fillStyle = '#08080a';
            ctx.fillRect(0, 0, width, height);

            // Apply Shake
            ctx.save();
            let dx = (Math.random() - 0.5) * shake;
            let dy = (Math.random() - 0.5) * shake;
            ctx.translate(dx, dy);

            // 1. Draw Grid (Retro effect)
            ctx.strokeStyle = isSurge ? '#ff0055' : '#1a1a20';
            ctx.lineWidth = 1;
            ctx.beginPath();
            // Moving grid logic
            let gridSize = 50;
            let offsetX = -player.x * 0.1 % gridSize;
            let offsetY = -player.y * 0.1 % gridSize;

            for (let x = offsetX; x < width; x += gridSize) {
                ctx.moveTo(x, 0); ctx.lineTo(x, height);
            }
            for (let y = offsetY; y < height; y += gridSize) {
                ctx.moveTo(0, y); ctx.lineTo(width, y);
            }
            ctx.stroke();

            // 2. Draw Particles
            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;

            // 3. Draw Powerups
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#00f3ff';
            ctx.fillStyle = '#fff';
            powerups.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.shadowBlur = 0;

            // 4. Draw Player Trail
            ctx.strokeStyle = player.isDashing ? '#fff' : '#00f3ff';
            ctx.lineWidth = player.isDashing ? 4 : 2;
            ctx.beginPath();
            if (player.trail.length > 0) {
                ctx.moveTo(player.trail[0].x, player.trail[0].y);
                for (let t of player.trail) ctx.lineTo(t.x, t.y);
            }
            ctx.stroke();

            // 5. Draw Player (With Chromatic Aberration if hit/dash)
            const drawPlayerBody = (offsetX, offsetY, color) => {
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(player.x + offsetX, player.y + offsetY, player.radius, 0, Math.PI * 2);
                ctx.fill();
            };

            if (chromatic > 1) {
                ctx.globalCompositeOperation = 'screen';
                drawPlayerBody(-2, 0, '#f00');
                drawPlayerBody(2, 0, '#00f');
                drawPlayerBody(0, 0, '#0f0');
                ctx.globalCompositeOperation = 'source-over';
            } else {
                ctx.shadowBlur = 20;
                ctx.shadowColor = player.isDashing ? '#fff' : '#00f3ff';
                drawPlayerBody(0, 0, '#fff');
                ctx.shadowBlur = 0;
            }

            // 6. Draw Enemies
            enemies.forEach(e => {
                ctx.fillStyle = e.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = e.color;

                ctx.save();
                ctx.translate(e.x, e.y);
                if (e.type === 1) ctx.rotate(e.angle); // Spin linear enemies

                ctx.beginPath();
                if (e.type === 0) {
                    // Triangle Chaser
                    ctx.moveTo(10, 0); ctx.lineTo(-8, 8); ctx.lineTo(-8, -8);
                } else if (e.type === 1) {
                    // Square Spinner
                    ctx.fillRect(-6, -6, 12, 12);
                } else if (e.type === 2) {
                    // Sniper Diamond
                    ctx.moveTo(0, -10); ctx.lineTo(10, 0); ctx.lineTo(0, 10); ctx.lineTo(-10, 0);
                }
                ctx.fill();
                ctx.restore();
                ctx.shadowBlur = 0;
            });

            // Draw Projectiles
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#b500ff';
            ctx.fillStyle = '#b500ff';
            projectiles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.shadowBlur = 0;

            // Draw Floating Texts
            ctx.font = "bold 14px 'Rajdhani'";
            ctx.textAlign = "center";
            floatingTexts.forEach(ft => {
                ctx.globalAlpha = ft.life;
                ctx.fillStyle = ft.color;
                ctx.fillText(ft.text, ft.x, ft.y);
            });
            ctx.globalAlpha = 1;

            // 7. Custom Cursor
            if (gameState === 'PLAYING') {
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(mouse.x, mouse.y, 15, 0, Math.PI * 2);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(mouse.x, mouse.y, 2, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }

        function animate() {
            if (gameState !== 'PLAYING') return;
            update();
            render();
            animationId = requestAnimationFrame(animate);
        }

        // Bind Buttons
        document.getElementById('btn-start').addEventListener('click', startGame);
        document.getElementById('btn-restart').addEventListener('click', startGame);

    </script>
</body>

</html>
